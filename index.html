
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Diet Tracker</title>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">

  <div id="root"></div>

  <!-- Load JavaScript files in dependency order -->
  <script type="text/babel" data-presets="env,react" src="js/config/constants.js"></script>

  <script type="text/babel" data-presets="env,react" src="js/components/Icon.js"></script>

  <script type="text/babel" data-presets="env,react" src="js/utils/planGenerator.js"></script>
  <script type="text/babel" data-presets="env,react" src="js/utils/coachEngine.js"></script>
  <script type="text/babel" data-presets="env,react" src="js/utils/groceryUtils.js"></script>
  <script type="text/babel" data-presets="env,react" src="js/utils/pdfUtils.js"></script>

  <script type="text/babel" data-presets="env,react" src="js/services/geminiService.js"></script>

  <script type="text/babel" data-presets="env,react" src="js/components/Navbar.js"></script>
  <script type="text/babel" data-presets="env,react" src="js/components/GeneratorView.js"></script>
  <script type="text/babel" data-presets="env,react" src="js/components/DietPlanView.js"></script>
  <script type="text/babel" data-presets="env,react" src="js/components/CoachView.js"></script>
  <script type="text/babel" data-presets="env,react" src="js/components/GroceryView.js"></script>
  <script type="text/babel" data-presets="env,react" src="js/components/HistoryView.js"></script>
  <script type="text/babel" data-presets="env,react" src="js/components/ApiKeyModal.js"></script>

  <!-- Main Application -->
  <script type="text/babel" data-presets="env,react" src="js/App.js"></script>

</body>
</html>
